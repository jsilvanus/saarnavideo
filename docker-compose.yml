services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: saarnavideo
      POSTGRES_USER: saarnavideo
      POSTGRES_PASSWORD: saarnavideo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment: &app-env
      DATABASE_URL: postgresql://saarnavideo:saarnavideo@postgres:5432/saarnavideo
      MEDIA_ROOT: /data/media
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-http://localhost:3000/api/integrations/youtube/callback}
    ports:
      - "3000:3000"
    volumes:
      - media_data:/data/media
    depends_on:
      - postgres

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *app-env
      WORKER_POLL_MS: 750
      AUDITOR_STT_URL: ${AUDITOR_STT_URL:-http://auditor-stt:8090}
      AUDITOR_STT_API_KEY: ${AUDITOR_STT_API_KEY:-}
    volumes:
      - media_data:/data/media
    depends_on:
      - postgres
      - auditor-stt

  # Self-hosted speech-to-text (faster-whisper) used by the worker's TRANSCRIBE jobs.
  # CPU image; the model is not baked in and downloads into the auditor_stt_models volume on first start.
  auditor-stt:
    image: ghcr.io/jsilvanus/liturgos-auditor-stt:latest
    environment:
      AUDITOR_STT_MODEL: ${AUDITOR_STT_MODEL:-base}
      AUDITOR_STT_DEVICE: cpu
      AUDITOR_STT_COMPUTE_TYPE: int8
      AUDITOR_STT_MODEL_DIR: /models
      AUDITOR_STT_DATA_DIR: /data
      AUDITOR_STT_API_KEY: ${AUDITOR_STT_API_KEY:-}
    ports:
      - "8090:8090"
    volumes:
      - auditor_stt_models:/models
      - auditor_stt_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  postgres_data:
  media_data:
  auditor_stt_models:
  auditor_stt_data:
