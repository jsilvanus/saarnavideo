name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: saarnavideo
          POSTGRES_USER: saarnavideo
          POSTGRES_PASSWORD: saarnavideo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saarnavideo -d saarnavideo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://saarnavideo:saarnavideo@localhost:5432/saarnavideo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate --schema prisma/schema.postgresql.prisma
      - run: npx prisma db push --schema prisma/schema.postgresql.prisma
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build self-contained media worker
        run: docker build -f Dockerfile.worker -t saarnavideo-worker:ci .
      - name: Verify worker toolchain
        run: |
          docker run --rm saarnavideo-worker:ci ffmpeg -version
          docker run --rm saarnavideo-worker:ci ffprobe -version
          docker run --rm saarnavideo-worker:ci yt-dlp --version

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm install
      - run: npx prisma generate
      - run: npm run test:e2e

  # Opt-in: the Auditor image is private, so this job only runs once a repo admin has allowed this
  # repository to pull it (Package settings > Manage Actions access) and set the repository
  # variable AUDITOR_E2E=true. The test also runs locally against any reachable AUDITOR_STT_URL.
  e2e-transcription:
    if: ${{ vars.AUDITOR_E2E == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      AUDITOR_STT_URL: http://127.0.0.1:8090
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      # Needed while the package is private; the package must also allow this repository under
      # Package settings > Manage Actions access (or be public).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start liturgos-auditor-stt (tiny model, CPU)
        run: |
          docker run -d --name auditor-stt -p 8090:8090 \
            -e AUDITOR_STT_MODEL=tiny -e AUDITOR_STT_DEVICE=cpu -e AUDITOR_STT_COMPUTE_TYPE=int8 \
            ghcr.io/jsilvanus/liturgos-auditor-stt:latest
          for i in $(seq 1 90); do
            curl -fsS "$AUDITOR_STT_URL/health" && exit 0
            sleep 2
          done
          docker logs auditor-stt
          exit 1
      - run: npm install
      - run: npx prisma generate
      - run: npm run test:e2e:transcription
      - name: STT service logs
        if: failure()
        run: docker logs auditor-stt
