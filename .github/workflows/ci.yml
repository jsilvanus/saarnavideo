name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: saarnavideo
          POSTGRES_USER: saarnavideo
          POSTGRES_PASSWORD: saarnavideo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saarnavideo -d saarnavideo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://saarnavideo:saarnavideo@localhost:5432/saarnavideo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npx tsc --noEmit
      - run: npm test
