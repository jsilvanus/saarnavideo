name: Publish images

# Builds the container images the deployment stack (jsilvanus/deploy-media) pulls:
#   saarnavideo               the web app and API (Dockerfile)
#   saarnavideo-worker        the job worker: ffmpeg, libass, fonts, yt-dlp (Dockerfile.worker)
#   saarnavideo-fleet-worker  fffleet worker + yt-dlp + the download executor (Dockerfile.fleet-worker)
# Tags: `latest` and `sha-<sha>` from main, `<version>` and `<major>.<minor>` from v*.*.* tags.
# The images are not pushed from pull requests.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: saarnavideo
            file: Dockerfile
          - image: saarnavideo-worker
            file: Dockerfile.worker
          - image: saarnavideo-fleet-worker
            file: Dockerfile.fleet-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
